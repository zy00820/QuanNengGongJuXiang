plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.qngxj.toolbox'
    compileSdk 35

    defaultConfig {
        applicationId "com.qngxj.toolbox"
        minSdk 19
        targetSdk 35
        versionCode 1117
        versionName "1.1.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 安卓 4.4-5.0 (API 19-20) 不支持矢量 drawable，启用兼容模式
        vectorDrawables.useSupportLibrary = true
        // 安卓 4.4-5.0 (API 19-20) 不原生支持 multidex，需启用兼容模式
        multiDexEnabled true
    }

    lint {
        // minSdk 19 低于部分 AndroidX 库标称最低版本，库内部已用 compat 处理；
        // 真正运行时风险由代码层 Build.VERSION 判断控制，此处关闭 lint 阻断以放行编译。
        abortOnError false
        checkReleaseBuilds false
        disable 'NewApi', 'OldTargetApi', 'ExpiredTargetSdkVersion'
    }

    // 签名配置：本地存在 release.jks 时使用正式签名，否则回退到 debug 签名
    // 这样公开仓库无需包含密钥库即可编译，保证云端打包兼容性
    def releaseKeystore = file('release.jks')
    if (releaseKeystore.exists()) {
        signingConfigs {
            release {
                storeFile releaseKeystore
                storePassword 'qngxj123456'
                keyAlias 'qngxj'
                keyPassword 'qngxj123456'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 仅当存在正式签名配置时引用，否则使用默认 debug 签名
            signingConfig releaseKeystore.exists() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Shizuku SDK（内置，无需用户额外下载）
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:shared:13.1.5'
    implementation 'dev.rikka.shizuku:aidl:13.1.5'

    // 网络检查更新
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON
    implementation 'org.json:json:20240303'
}
